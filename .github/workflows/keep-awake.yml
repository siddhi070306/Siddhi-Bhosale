# Render's free plan puts the backend to sleep after 15 idle minutes, and waking it takes about a minute. This pings it every
# 10 minutes from 08:30 to 00:30 India time (03:00-19:00 UTC), so it is awake for demos; at night it may sleep, which keeps
# it well inside Render's 750 free hours a month. Set the repository variable BACKEND_URL (Settings > Secrets and variables >
# Actions > Variables) to the Render URL, e.g. https://apex-zenith-backend.onrender.com; without it the job does nothing.
name: keep-backend-awake
on:
  schedule:
    - cron: "*/10 3-18 * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the backend
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}
        run: |
          if [ -z "$BACKEND_URL" ]; then echo "BACKEND_URL is not set; nothing to ping"; exit 0; fi
          curl -fsS --max-time 120 "$BACKEND_URL/api/status" -o /dev/null -w "HTTP %{http_code} in %{time_total}s\n" || echo "backend did not answer"
